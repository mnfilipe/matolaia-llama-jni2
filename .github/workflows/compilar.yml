name: Compilar libmatola_llama.so

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Clonar llama.cpp
        run: git clone --depth=1 https://github.com

      - name: Instalar o NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b

      - name: Configurar (CMake)
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release -j$(nproc)

      - name: Encontrar o .so gerado
        run: find build -name "*.so"

      - name: Enviar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: libmatola_llama-arm64-v8a
          path: build/**/libmatola_llama.so
          
